name: Build and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
      - '!v*-*'
      - 'v[0-9]*-rc.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0). If omitted, inferred from git tag or latest tag.'
        required: false
        default: ''
      publish_release:
        description: 'Force publish GitHub Release (true/false/auto)'
        required: false
        default: 'auto'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve_version.outputs.version }}
      is_release: ${{ steps.check_release.outputs.is_release }}
      is_prerelease: ${{ steps.check_release.outputs.is_prerelease }}
      deploy_pages: ${{ steps.check_release.outputs.deploy_pages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve Version
        id: resolve_version
        run: |
          STABLE_TAG_REGEX='^v[0-9]+(\.[0-9]+(\.[0-9]+)?)?$'
          RELEASE_TAG_REGEX='^v[0-9]+(\.[0-9]+(\.[0-9]+)?)?(-rc\.[0-9]+)?$'
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/ ]] && [[ "$GITHUB_REF_NAME" =~ $RELEASE_TAG_REGEX ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LATEST_RELEASE_TAG=$(git tag --merged HEAD --sort=-v:refname | grep -E "$STABLE_TAG_REGEX" | head -n 1 || true)
            if [ -n "$LATEST_RELEASE_TAG" ]; then
              VERSION="${LATEST_RELEASE_TAG#v}"
            else
              VERSION=$(python3 -c "import ot; print(ot.__version__)")
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Determine if release should be published
        id: check_release
        run: |
          RELEASE_TAG_REGEX='^v[0-9]+(\.[0-9]+(\.[0-9]+)?)?(-rc\.[0-9]+)?$'
          VERSION="${{ steps.resolve_version.outputs.version }}"
          FORCE="${{ github.event.inputs.publish_release }}"

          if [[ "$VERSION" =~ -rc\.[0-9]+$ ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          if [ "$FORCE" = "true" ]; then
            IS_RELEASE="true"
          elif [ "$FORCE" = "false" ]; then
            IS_RELEASE="false"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/ ]] && [[ "$GITHUB_REF_NAME" =~ $RELEASE_TAG_REGEX ]]; then
            IS_RELEASE="true"
          else
            IS_RELEASE="false"
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            DEPLOY_PAGES="false"
          else
            DEPLOY_PAGES="true"
          fi

          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "deploy_pages=${DEPLOY_PAGES}" >> "$GITHUB_OUTPUT"

      - name: Run Test Suite
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests

      - name: Build Release Artifacts
        run: |
          ./scripts/build-release --version "${{ steps.resolve_version.outputs.version }}"

      - name: Prepare GitHub Pages Site
        if: steps.check_release.outputs.deploy_pages == 'true'
        run: |
          mkdir -p _site/docs
          cp -r web/* _site/
          cp -r docs/* _site/docs/
          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md _site/CHANGELOG.md
          fi
          touch _site/.nojekyll

          python3 -c "
          import html as html_lib, pathlib, re, subprocess

          version = '${{ steps.resolve_version.outputs.version }}'
          try:
              with open('dist/SHA256SUMS', 'r') as f:
                  sha_val = f.read().split()[0]
              sha_short = sha_val[:12]
          except Exception:
              sha_short = 'unknown'

          changelog_text = ''
          if pathlib.Path('CHANGELOG.md').is_file():
              changelog_text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8').strip()

          # If CHANGELOG.md at HEAD was reset for the next -dev cycle, prefer the tag's CHANGELOG.md
          body_lines = [ln.strip() for ln in changelog_text.splitlines() if ln.strip() and not ln.strip().startswith('#')]
          if not body_lines:
              try:
                  tag_cl = subprocess.check_output(['git', 'show', f'v{version}:CHANGELOG.md'], text=True, stderr=subprocess.DEVNULL).strip()
                  tag_body = [ln.strip() for ln in tag_cl.splitlines() if ln.strip() and not ln.strip().startswith('#')]
                  if tag_body:
                      changelog_text = tag_cl
                      body_lines = tag_body
                      pathlib.Path('_site/CHANGELOG.md').write_text(changelog_text + '\n', encoding='utf-8')
              except Exception:
                  pass

          def format_inline(text):
              escaped = html_lib.escape(text)
              return re.sub(r'\`([^\`]+)\`', r'<code>\1</code>', escaped)

          if body_lines:
              items_html = []
              for ln in body_lines:
                  clean_ln = re.sub(r'^[-*]\s+', '', ln)
                  items_html.append(f'<li>{format_inline(clean_ln)}</li>')
              changelog_html = '<ul class=\"changelog-list\">\n' + '\n'.join(items_html) + '\n</ul>'
          else:
              changelog_html = f'<p class=\"changelog-empty\">See the <a href=\"https://github.com/headhunter45/opentasks/releases/tag/v{version}\">v{version} GitHub Release</a> for details.</p>'

          with open('_site/index.html', 'r', encoding='utf-8') as f:
              page_html = f.read()
          page_html = page_html.replace('__OT_VERSION__', version)
          page_html = page_html.replace('__OT_SHA256_SHORT__', sha_short)
          page_html = page_html.replace('__OT_CHANGELOG_HTML__', changelog_html)
          with open('_site/index.html', 'w', encoding='utf-8') as f:
              f.write(page_html)
          "

      - name: Upload Pages Artifact
        if: steps.check_release.outputs.deploy_pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish GitHub Release
        if: steps.check_release.outputs.is_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.resolve_version.outputs.version }}"
          TAG_NAME="v${VERSION}"
          IS_PRERELEASE="${{ steps.check_release.outputs.is_prerelease }}"
          echo "Publishing GitHub Release for tag: ${TAG_NAME} (prerelease=${IS_PRERELEASE})"

          if [ "$IS_PRERELEASE" = "true" ]; then
            RELEASE_TITLE="Open Tasks v${VERSION} (Release Candidate)"
            CREATE_FLAGS=(--prerelease)
            EDIT_FLAGS=(--prerelease)
          else
            RELEASE_TITLE="Open Tasks v${VERSION}"
            CREATE_FLAGS=(--latest)
            EDIT_FLAGS=(--prerelease=false --latest)
          fi

          NOTES_ARGS=(--generate-notes)
          if [ -f CHANGELOG.md ]; then
            NOTES_ARGS=(--notes-file CHANGELOG.md)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists. Updating release assets and notes..."
            if [ -f CHANGELOG.md ]; then
              gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" "${EDIT_FLAGS[@]}" --notes-file CHANGELOG.md
            else
              gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" "${EDIT_FLAGS[@]}"
            fi
            gh release upload "$TAG_NAME" \
              "dist/ot-${VERSION}.zipapp" \
              dist/ot.zipapp \
              "dist/ot-${VERSION}-manifest.json" \
              dist/ot-manifest.json \
              dist/SHA256SUMS --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              "dist/ot-${VERSION}.zipapp" \
              dist/ot.zipapp \
              "dist/ot-${VERSION}-manifest.json" \
              dist/ot-manifest.json \
              dist/SHA256SUMS \
              --title "$RELEASE_TITLE" \
              "${CREATE_FLAGS[@]}" \
              "${NOTES_ARGS[@]}"
          fi

  deploy-pages:
    needs: build-and-publish
    if: needs.build-and-publish.outputs.deploy_pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
